schema_version: 1
object_id: IMPROVEMENTCORE:IC030:SCOPE-MODE-POLICY:001
date: 2026-09-24
status: semantic_policy_candidate
controller: IC-2026-09-24-030-CANDIDATE

scope_priority_hints:
  SYSTEM:
    triggers: [root_goal_change,whole_architecture_question,global_closure_claim,cross_project_controller_issue]
  SUBSYSTEM:
    triggers: [bounded_module_issue,local_open_coordinate,subsystem_dependency]
  COMPONENT:
    triggers: [single_tool_operator_definition_runtime_worker_issue]
  INTERFACE:
    triggers: [handoff_mismatch,order_effect,producer_consumer_gap,relation_bridge]
  BOUNDARY_DECOMPOSITION:
    triggers: [ownership_conflict,factorization_question,primitive_basis_question,scope_cut_issue]
  CROSS_LAYER:
    triggers: [semantic_runtime_gap,authority_currentness_gap,evidence_persistence_gap,promotion_claim]

mode_priority_hints:
  EXPAND:
    triggers: [candidate_coverage_open,representation_uncertain,novel_tool_search,hidden_relation_search,stalled_contract]
  CONTRACT:
    triggers: [live_discriminator,known_defect,completion_coordinate,admitted_candidate_needs_resolution]
  INWARD:
    triggers: [hidden_dependency,internal_mechanism,component_structure,proof_obligation]
  OUTWARD:
    triggers: [environment_effect,cross_project_relation,external_comparator,transfer_candidate,open_system_boundary]
  ISOLATE:
    triggers: [causal_claim,holdout,contamination_risk,path_dependence,independent_validation]
  COUPLE:
    triggers: [admitted_discovery,positive_catalytic_gain,cross_tool_synergy,shared_frontier_update]

mode_switch_rules:
  - from: EXPAND
    to: CONTRACT
    when: candidate_frontier_contains_high_value_discriminator_or_actionable_result
  - from: CONTRACT
    to: EXPAND
    when: contraction_stalls_or_false_closure_risk_detected
  - from: INWARD
    to: OUTWARD
    when: external_dependency_or_environmental_constraint_is_result_sensitive
  - from: OUTWARD
    to: INWARD
    when: external_relation_requires_internal_mechanism_resolution
  - from: COUPLE
    to: ISOLATE
    when: independence_or_contamination_control_becomes_result_sensitive
  - from: ISOLATE
    to: COUPLE
    when: independent_result_is_admitted_and_information_sharing_has_positive_value

coverage_rules:
  no_blind_36_execution: true
  applicable_cells_only: true
  result_sensitivity_gate: true
  cell_skip_requires_typed_reason: true
  global_closure_requires_all_applicable_result_sensitive_cells_terminal: true

selection:
  output: [scope,mode,tool_package,budget,binding]
  preserve_incomparable_candidates: true
  no_scalar_global_score: true
  empirical_calibration_required_for_dominance_claims: true
