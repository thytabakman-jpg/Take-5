name: ImproveCore Self Study 104

on:
  push:
    branches: [main]
    paths:
      - 'runtime/improvement_core_self_study.py'
      - 'integration/IMPROVECORE_SELF_STUDY_INPUT_104_2026-09-26.md'
      - 'research/IMPROVECORE_EXTERNAL_ARCHITECTURE_RESEARCH_104_2026-09-26.md'
      - 'runtime/improvement_core_*.py'
      - 'runtime/ic028_operator.py'
      - 'integration/CURRENT_IMPROVEMENT_CORE.md'
      - '.github/workflows/improvecore-self-study-104.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run current ImproveCore self-study
        run: PYTHONPATH=runtime:. python3 runtime/improvement_core_self_study.py
      - name: Upload self-study receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: improvecore-self-study-104
          path: runtime/state/improvecore-self-study-104/report.json
