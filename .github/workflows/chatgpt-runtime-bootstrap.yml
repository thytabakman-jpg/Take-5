name: ChatGPT runtime bootstrap
# Historical optional packaging transport. Repair uses connector/local recovery.
# Never trigger on source, integration or request-file changes.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-runtime-bootstrap
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
          path: source
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: bootstrap
      - name: Verify document adapter integration
        shell: bash
        env:
          PYTHONPATH: ${{ github.workspace }}/source/runtime:${{ github.workspace }}/source:${{ github.workspace }}/bootstrap/chatgpt-integration
        run: python3 -B -m unittest discover -s "$GITHUB_WORKSPACE/bootstrap/chatgpt-integration" -p test_document_tool_adapters.py -v
      - name: Package authoritative tracked source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/take5-runtime"
          cp "$GITHUB_WORKSPACE/bootstrap/chatgpt-integration/"{runtime_bootstrap.py,execute_tool_packet.py,document_tool_adapters.py,README.md} "$RUNNER_TEMP/take5-runtime/"
          git -C "$GITHUB_WORKSPACE/bootstrap" rev-parse HEAD > "$RUNNER_TEMP/take5-runtime/integration-commit.txt"
          cd "$GITHUB_WORKSPACE/source"
          git rev-parse HEAD > "$RUNNER_TEMP/take5-runtime/source-commit.txt"
          git cat-file commit HEAD > "$RUNNER_TEMP/take5-runtime/source-commit-object.txt"
          git ls-tree -r -z HEAD > "$RUNNER_TEMP/take5-runtime/git-tree.txt"
          git archive --format=zip --output="$RUNNER_TEMP/take5-runtime/take5-source.zip" HEAD
          cd "$RUNNER_TEMP/take5-runtime"
          sha256sum take5-source.zip > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: take5-chatgpt-runtime
          path: ${{ runner.temp }}/take5-runtime/
          retention-days: 90
          if-no-files-found: error
