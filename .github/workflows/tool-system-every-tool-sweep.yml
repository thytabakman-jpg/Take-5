name: Tool System Every-Tool Sweep
on:
  pull_request:
    branches: [main]
    paths:
      - 'runtime/tool_system_every_tool_sweep.py'
      - 'tests/test_tool_system_every_tool_sweep.py'
      - 'projects/tool-system/**'
      - '.github/workflows/tool-system-every-tool-sweep.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/tool_system_every_tool_sweep.py'
      - 'tests/test_tool_system_every_tool_sweep.py'
      - 'projects/tool-system/**'
      - '.github/workflows/tool-system-every-tool-sweep.yml'
  workflow_dispatch:

concurrency:
  group: tool-system-every-tool-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run every registered tool plus development audits
        run: PYTHONPATH=runtime:. python runtime/tool_system_every_tool_sweep.py --json-out runtime/state/tool-system-every-tool-sweep.json
      - name: Run dedicated sweep regression tests
        run: PYTHONPATH=runtime:. pytest -q tests/test_tool_system_every_tool_sweep.py
      - name: Upload every-tool receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tool-system-every-tool-sweep
          path: runtime/state/tool-system-every-tool-sweep.json
