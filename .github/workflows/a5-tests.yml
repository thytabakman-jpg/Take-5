name: A5 Tests
on:
  push:
    paths:
      - 'runtime/a5_core.py'
      - 'tests/test_a5_core.py'
      - 'tests/test_a5_registry.py'
      - 'runtime/a5_programs.py'
      - '.github/workflows/a5-tests.yml'
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: PYTHONPATH=runtime pytest -q tests/test_a5_core.py tests/test_a5_registry.py
