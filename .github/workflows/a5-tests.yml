name: Take-5 Validation
on:
  push:
    paths:
      - 'runtime/**'
      - 'tests/**'
      - 'dump/**'
      - '.github/workflows/a5-tests.yml'
  pull_request:
    paths:
      - 'runtime/**'
      - 'tests/**'
      - 'dump/**'
      - '.github/workflows/a5-tests.yml'
  workflow_dispatch:

concurrency:
  group: take5-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Run A5 test suite
        run: PYTHONPATH=runtime:. pytest -q tests
      - name: Run canonical whole-system audit
        run: PYTHONPATH=runtime:. python3 runtime/system_audit.py
      - name: Run closed-loop fixture
        run: python3 runtime/closed_loop_v2.py
      - name: Run zero-request dump
        run: python3 runtime/take5_dump.py dump/example-zero --state runtime/state/example-zero
      - name: Upload validation receipts
        uses: actions/upload-artifact@v4
        with:
          name: take5-validation-receipts
          path: |
            runtime/closed_loop_receipt.json
            runtime/state/example-zero/
