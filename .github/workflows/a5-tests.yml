name: Take-5 Validation
on:
  push:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'tests/**'
      - 'dump/**'
      - 'architecture/**'
      - 'integration/**'
      - 'migration/**'
      - 'provenance/**'
      - 'research/**'
      - 'KERNEL.yaml'
      - 'MIGRATION_STATE.yaml'
      - 'ARCHITECTURE_CANDIDATE.yaml'
      - 'CAPABILITY_CURRENTNESS_MATRIX.md'
      - 'CURRENTNESS_AND_PLACEMENT_PROGRAM.md'
      - 'FINISH_LINE.md'
      - 'FUNCTIONALITY_RECOVERY_LEDGER.md'
      - 'ICC_AUTONOMOUS_STEWARDSHIP.md'
      - 'MAP_CAPTURE_POLICY.md'
      - 'PROMOTION_BENCHMARK.md'
      - 'SUCCESSOR_CHARTER.md'
      - 'GITHUB_GOVERNANCE.md'
      - 'SECURITY.md'
      - 'requirements-dev.txt'
      - '.gitignore'
      - '.github/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - 'runtime/**'
      - 'tests/**'
      - 'dump/**'
      - 'architecture/**'
      - 'integration/**'
      - 'migration/**'
      - 'provenance/**'
      - 'research/**'
      - 'KERNEL.yaml'
      - 'MIGRATION_STATE.yaml'
      - 'ARCHITECTURE_CANDIDATE.yaml'
      - 'CAPABILITY_CURRENTNESS_MATRIX.md'
      - 'CURRENTNESS_AND_PLACEMENT_PROGRAM.md'
      - 'FINISH_LINE.md'
      - 'FUNCTIONALITY_RECOVERY_LEDGER.md'
      - 'ICC_AUTONOMOUS_STEWARDSHIP.md'
      - 'MAP_CAPTURE_POLICY.md'
      - 'PROMOTION_BENCHMARK.md'
      - 'SUCCESSOR_CHARTER.md'
      - 'GITHUB_GOVERNANCE.md'
      - 'SECURITY.md'
      - 'requirements-dev.txt'
      - '.gitignore'
      - '.github/**'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: take5-validation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run Take-5 test suite
        run: PYTHONPATH=runtime:. pytest -q tests
      - name: Run canonical whole-system audit
        run: PYTHONPATH=runtime:. python3 runtime/system_audit.py
      - name: Run closed-loop fixture
        run: python3 runtime/closed_loop_v2.py
      - name: Run zero-request dump
        run: python3 runtime/take5_dump.py dump/example-zero --state runtime/state/example-zero
      - name: Upload validation receipts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: take5-validation-receipts
          path: |
            runtime/closed_loop_receipt.json
            runtime/state/example-zero/
