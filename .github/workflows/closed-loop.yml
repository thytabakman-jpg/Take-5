name: Take-5 Closed Loop Fixture
on:
  push:
    paths:
      - 'runtime/**'
      - '.github/workflows/closed-loop.yml'
  workflow_dispatch:
jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Take-5 closed loop
        run: python3 runtime/closed_loop.py
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: take5-closed-loop-receipt
          path: runtime/receipt.json
