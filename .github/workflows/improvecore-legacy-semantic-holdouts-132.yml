name: ImproveCore Legacy Semantic Holdouts 132

on:
  pull_request:
    paths:
      - 'integration/IMPROVECORE_LEGACY_SEMANTIC_HOLDOUT_PACKET_132.json'
      - 'runtime/improvement_core_legacy_semantic_holdouts_132.py'
      - 'runtime/improvement_core_legacy_restored.py'
      - '.github/workflows/improvecore-legacy-semantic-holdouts-132.yml'
  push:
    branches: [main]
    paths:
      - 'integration/IMPROVECORE_LEGACY_SEMANTIC_HOLDOUT_PACKET_132.json'
      - 'runtime/improvement_core_legacy_semantic_holdouts_132.py'
      - 'runtime/improvement_core_legacy_restored.py'
      - '.github/workflows/improvecore-legacy-semantic-holdouts-132.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-holdouts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.12'
      - name: Run semantic routing holdouts through restored ImprovementCore
        run: PYTHONPATH=runtime:. python3 runtime/improvement_core_legacy_semantic_holdouts_132.py
      - name: Upload semantic holdout receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: improvecore-legacy-semantic-holdouts-132
          path: runtime/state/improvecore-legacy-semantic-holdouts-132/report.json
