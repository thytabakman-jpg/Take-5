name: Kernel 053 Durable Backend Bakeoff

on:
  pull_request:
    branches: [main]
    paths:
      - 'runtime/kernel053_*'
      - 'runtime/icc128_episode_adapter.py'
      - 'runtime/icc_entry_053_candidate.py'
      - 'runtime/icc128_entry_binding.py'
      - 'tests/test_kernel053_*'
      - 'architecture/KERNEL_053_REUSE_FIRST_IMPLEMENTATION_BLUEPRINT_001_2026-10-02.md'
      - '.github/workflows/kernel053-durable-bakeoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dbos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install baseline test dependency
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Install pinned DBOS bakeoff dependency
        run: python -m pip install --disable-pip-version-check 'dbos[aiosqlite]==3.1.0'
      - name: Run Kernel 053 ownership, configured-execution, and DBOS durability holdouts
        run: PYTHONPATH=runtime:. pytest -q tests/test_kernel053_candidate.py tests/test_kernel053_promotion_receipt.py tests/test_kernel053_dbos_bakeoff.py
      - name: Emit repository-native ICC128 configured execution receipt
        run: PYTHONPATH=runtime:. python runtime/kernel053_promotion_receipt.py --json-out runtime/state/kernel053-repository-execution-receipt.json
      - name: Upload Kernel 053 repository execution receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: kernel053-repository-execution-receipt
          path: runtime/state/kernel053-repository-execution-receipt.json
