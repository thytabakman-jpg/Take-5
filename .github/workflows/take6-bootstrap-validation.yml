name: Take-6 Bootstrap Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'take6-bootstrap/**'
      - '.github/workflows/take6-bootstrap-validation.yml'
  push:
    branches: [main]
    paths:
      - 'take6-bootstrap/**'
      - '.github/workflows/take6-bootstrap-validation.yml'
  workflow_dispatch:

concurrency:
  group: take6-bootstrap-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install pinned development dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run isolated Take-6 bootstrap invariants
        run: PYTHONPATH=take6-bootstrap:. pytest -q take6-bootstrap/tests
