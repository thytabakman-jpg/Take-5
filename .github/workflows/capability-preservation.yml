name: Capability Preservation

on:
  pull_request:
    branches: [main]

jobs:
  preservation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate capability preservation manifest
        env:
          PYTHONPATH: runtime
        run: |
          python -m pytest -q             tests/test_capability_preservation.py             tests/test_capability_preservation_manifest.py             tests/test_jane_continuity.py             tests/test_kernel_preservation.py
