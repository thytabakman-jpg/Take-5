schema_version: 0.1
object_id: REASERCH:ICC128-SEMANTIC-GENERATOR:001
date: 2026-09-26
status: current_semantic_generator_contract
purpose: >
  Restore the historical question/work generator semantics behind ICC-128 from the old recursive
  PD audit. G_Q and G_W are generated from the unresolved structure of the current epistemic state,
  not from a generic brainstorming prompt.

historical_basis:
  recovered_sources:
    - PD_Old_Recursive_Audit_ArtifactSafe_v1_0.md
    - old_recursive_audit.txt
  protected_instruction: >
    Build the inquiry so that each next question is generated by the unresolved structure of the
    previous state.

epistemic_state:
  fields:
    - live_question
    - live_candidate_answers
    - available_distinctions
    - evidence_and_arguments
    - established_claims
    - excluded_possibilities
    - unresolved_dependencies
    - current_inferential_capacity
    - search_space

G_Q:
  job: >
    Reconstruct the current epistemic state and generate only questions that become rationally
    available from its unresolved structure. For each question identify what changed that made the
    question available now.
  required_outputs:
    - question_id
    - question
    - live_candidate_answers
    - enabling_discovery_or_distinction
    - unresolved_structure
    - downstream_dependency
  anti_patterns:
    - generic_brainstorming_unlinked_to_state
    - importing_later_discoveries_into_earlier_state
    - question_generation_without_candidate_space_change
    - silently_discarding_competing_interpretations

G_W:
  job: >
    For each live question generate discriminating work: evidence, argument, distinction,
    counterexample, comparison, source, formal test, or other probe capable of separating the live
    candidate answers or exposing that the frame itself is wrong.
  required_outputs:
    - work_id
    - question_id
    - probe_or_test
    - candidate_answers_discriminated
    - expected_search_space_effect
    - required_inputs_or_sources
    - execution_or_semantic_route

transition:
  sequence:
    - reconstruct_epistemic_state
    - identify_transition_cause
    - identify_competing_interpretations
    - identify_search_space_change
    - generate_next_question
    - generate_discriminating_work
    - return_to_rho_128_for_selection
  recurrence: >
    After admitted evidence/result, rebuild the epistemic state from the changed search space and
    generate the next question again.

search_space_rule: >
  Every material discovery must record candidate-space-before, discriminating discovery/test, and
  candidate-space-after. Information accumulation without problem-structure transformation is not
  automatically a new inquiry stage.

clean_reconstruction_rule: >
  When the current organization appears path-dependent or confused, construct the ideal discovery
  sequence from E0 to En using live question, live candidates, discriminating test, resulting
  discovery, search-space change, and next question. Compare this with the existing path without
  assuming historical order is necessary.

upstream_discovery_ref:
  contract: projects/improvement-core/IMPROVEMENT_CORE_UPSTREAM_DISCOVERY_CURRENT.yaml
  role: >
    When a correct substantive job/question is not yet warranted, or when broad relation
    generation can materially change the candidate universe, run upstream discovery before
    G_Q/G_W. Admitted jobs/questions/work then enter this generator. Zero-request task formation
    and relation generation are not silently collapsed into ordinary G_Q brainstorming.

relationship_to_rho:
  contract: projects/improvement-core/ICC128_RHO_POLICY_CURRENT.yaml
  rule: >
    G_Q/G_W generate candidate inquiry and work. rho_128 selects among them and capabilities.
    Generation and selection remain distinct.

runtime_adapter:
  contract: runtime/icc128_semantic_generator_adapter.py
  open_boundary: >
    The adapter can validate and carry model-generated semantic output. The quality of open-ended
    generation depends on the active reasoning model and supplied state; repository code alone
    cannot create semantic insight.


upstream_origin_preservation:
  trigger: upstream_context_present
  required_fields:
    - origin_mode
    - source_job_id
    - job_basis
    - source_relations
    - candidate_universe_delta
  invariant: >
    A job discovered by upstream zero-request/relation generation must remain distinguishable
    from a host-supplied substantive job after handoff into G_Q/G_W. The semantic generator
    must return an upstream_origin_witness preserving source_job_id, job_basis, and
    source_relations. Missing or mismatched origin evidence is fail-closed.
  purpose: >
    Preserve evidence that responsibility transfer and job discovery were endogenous rather
    than silently laundering an upstream-discovered job into an anonymous ordinary task.
