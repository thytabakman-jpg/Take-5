conversation_failure_repair_2026_09_24:
  source: current ICC conversation retrospective
  status: candidate_semantic_repair
  failure_class: execution_claim_and_meta_process_displacement
  observed_failures:
    - repeated planning_or_inventory_reported_in_place_of_requested_execution
    - semantic_protocol_application_blurred_with_executable_runtime_execution
    - requested_per_object_one_at_a_time_runs_collapsed_into_cross_tool_synthesis
    - user_requested_legacy_fallback_not_proven_per_object_before_summary
    - completion_language_used_without_completion_evidence
    - replanning_recurred_after_user_had_already_frozen_the_execution_plan
    - output_length_obscured_execution_status
  mandatory_execution_ledger:
    states: [DISCOVERED,CONSIDERED,SELECTED,SEMANTICALLY_APPLIED,IMPLEMENTATION_EXECUTED,RESULT_USED,NOT_APPLICABLE,BLOCKED]
    rule: >
      Never report a capability as run from discovery, selection, or semantic application alone.
      Every requested capability-object pair receives one explicit ledger state.
  frozen_plan_rule: >
    Once the user freezes an execution plan, inventory and replanning are subordinate steps,
    not completion. Continue object-level execution until every requested object has a terminal
    ledger state or a concrete blocker is recorded.
  per_object_completion_gate:
    required:
      - object_identity
      - requested_capability_set
      - ledger_state_for_every_requested_capability
      - current_tools_pass
      - closure_test
      - legacy_fallback_when_still_open
      - hostile_verification
      - result_and_open_coordinates
    rule: no_cross_object_completion_claim_before_each_object_passes_this_gate
  truth_in_reporting:
    - say_semantically_applied_when_a_repository_protocol_was_reasoned_through_without_executable_implementation
    - say_implementation_executed_only_when_an_actual_runtime_or_connector_action_executed_that_implementation
    - say_not_done_when_the_requested_gate_has_not_closed
    - planning_inventory_and_retrieval_are_never_execution
  anti_meta_displacement:
    measure: >
      A controller cycle must produce an object-level state delta or a typed blocker.
      A repeated plan, inventory, or explanation with no such delta is NOOP and cannot
      satisfy the task.
  concise_reporting:
    default_shape: [done_status,results,changes,next_automatic_action]
    detail: on_request
  regression_fixture:
    prompt_pattern: run_all_tools_one_at_a_time_on_each_unresolved_letter_then_compare
    failure_condition: >
      assistant returns a plan, inventory, or synthesized result before ledgering every
      requested capability-object pair.
  integration_target:
    - IC022 successor generation
    - capability operational contract
    - practical execution reporting
  authority_boundary: >
    This block records a semantic candidate repair only. It does not promote IC-022,
    alter IC-018 runtime authority, or prove executable enforcement.
