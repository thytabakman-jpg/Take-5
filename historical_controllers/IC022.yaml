tool_ecosystem_self_improvement_001:
  controller: IC-022
  cycles: 5
  goal: maximize useful system capability while minimizing redundancy, semantic loss, unnecessary tool execution, and false gap creation
  capability_comparison_key:
    signature: [input, preconditions, information, transform, output, license, consequence, cost, evidence]
    rule: tool_name_and_version_are_implementation_metadata_not_comparison_units
  package_selection:
    dominance: >
      P1 dominates P2 only if P1 preserves at least the same protected capability frontier under the active evaluation context and strictly improves at least one declared efficiency, robustness, redundancy, cost, or evidence coordinate.
    search_order: [singles_first, ordered_pairs_when_interaction_material, higher_order_when_material_noncommutation_or_unique_residual]
    preserve: [incomparable_packages, OPEN, branch_distinctions]
  gap_detection:
    rule: >
      Do not create a new tool until existing capabilities and compositions have been challenged and shown insufficient for the target job.
  composition_verification:
    checks: [semantic_type_compatibility, authority_compatibility, provenance_preservation, OPEN_preservation, incomparable_branch_preservation, state_delta_detection, redundancy, order_sensitivity, protected_behavior]
  evidence_synthesis:
    product: [semantic_evidence, runtime_evidence, authority_gate, cost, redundancy, preservation]
    rule: >
      Semantic improvement without runtime evidence remains a valid candidate state but is not runtime promotable. Evidence coordinates are never silently collapsed.
  reselection:
    trigger: [material_capability_change, package_frontier_change, state_change, new_counterexample, new_evidence]
  result:
    verdict: ecosystem_optimization_pass
    new_top_level_role: false
    new_IC_version_licensed: false
    current_controller: IC-022


