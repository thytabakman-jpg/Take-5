schema_version: 1
object_id: IMPROVEMENTCORE:SPEC:2026-09-24-022
version_id: IC-2026-09-24-022
date: 2026-09-24
status: research_candidate_unpromoted
authority: semantic_improvement_core_experiment
mutation_authority: none
constructed_by: IC-2026-09-24-021
base_spec: projects/improvement-core/versions/IC-2026-09-24-021.yaml
purpose: >
  Improve ImprovementCore itself. IC-022 is an experimental successor candidate whose
  controller is explicitly tasked with discovering, testing, and integrating any
  material improvement to its own semantic architecture while preserving protected
  behavior. It may revise its own controller model only through explicit successor
  candidates, never by self-promotion.

self_improvement_contract:
  target: ImprovementCore itself
  protected:
    - role typing
    - authority separation
    - OPEN/INCOMPARABLE preservation
    - behavioral state sufficiency
    - legacy capability coverage
    - branch/protection semantics
    - result carrier distinctions
    - no-smuggling constraint
  strict_gain:
    - new demonstrated capability
    - stronger theorem
    - reduced semantic loss
    - reduced search redundancy
    - improved routing efficiency
    - stronger regression coverage
  stop_rules:
    - no material delta
    - only implementation/documentation changes remain
    - unresolved issue can be represented by existing semantics without loss
    - self-reference would be used to justify promotion

controller:
  model: labeled_recursive_transition_system
  roles: [K,S,O,G,M,C,R,U]
  equation: >
    q_n in R_K(S_n);
    X_n in G_q(K,S_n,I_n);
    Y_n = M_q[O_q](K,S_n,I_n,X_n);
    A_n = C_q(K,S_n,Y_n);
    S_(n+1) in U_K(S_n,q_n,Y_n,A_n,e_n);
    q_(n+1) in R_K(S_(n+1)).
  behavioral_equivalence: >
    Recursive state equivalence is J-preserving behavioral/bisimulation equivalence over
    reachable labeled transition systems, preserving protected observations, admissibility,
    authority, provenance, status, constraints, lineage, and routing.
  router: >
    R returns the nondominated eligible frontier; recursive sufficiency requires preservation
    of future reachable behavior.
  modifier: >
    M is a typed partial transformation algebra with six demonstrated configuration axes.
  update: >
    U is a typed relational successor correspondence supporting branching, invalidation,
    and reconciliation.
  result_carrier:
    - ACCEPT
    - CONSTRAIN
    - OPEN
    - BLOCKED
    - FAIL
    - CONFLICT
    - NOOP

capability_registry:
  canonical: projects/tool-optimization/CAPABILITY_REGISTRY_V4_IC022.yaml
  discoverability_index: projects/tool-optimization/CAPABILITY_REGISTRY_CURRENT.md
  legacy_registry: projects/pd/practical/PRACTICAL_CORE_CAPABILITY_REGISTRY.yaml
  operational_contract: projects/tool-optimization/CAPABILITY_OPERATIONAL_CONTRACT_IC022_V1.yaml
  operational_overlay: projects/tool-optimization/CAPABILITY_OPERATIONAL_OVERLAY_IC022_V1.yaml
  package_alias_registry: projects/tool-optimization/PACKAGE_ALIAS_REGISTRY_IC022.yaml
  resolution_spec: projects/tool-optimization/TOOL_REPERTOIRE_RESOLUTION_SPEC_IC022.yaml
  definition_gate: projects/tool-optimization/DEFINITION_COMPLETENESS_GATE_IC022.yaml
  negative_space_contract: projects/tool-optimization/PICK_NEGATIVE_SPACE_CONTRACT_IC022.yaml
  external_capability_registry: projects/tool-optimization/EXTERNAL_CAPABILITY_REGISTRY_IC022_V1.yaml
  rule: >
    The canonical internal capability universe is discovered from the current research
    capability registry at task entry. The legacy practical registry supplies stable
    provenance IDs and runtime capability references. Do not hard-code a finite list of
    capability implementations into the controller.
  normalization: >
    Resolve registry entries into capability signatures
    <input,preconditions,information,transform,output,license,consequence,cost,evidence>.
  selection: >
    Resolve the smallest semantically appropriate layer, pass the definition-completeness
    gate, construct the eligible package frontier, record material nonselection reasons,
    and preserve OPEN/incomparable candidates. Do not assume all discovered capabilities
    are relevant or executable.
  optimization: >
    Activate Tool Optimization only when material repertoire/package evidence changes;
    otherwise do not recursively re-optimize the repertoire.
  updated_capabilities: >
    Any accepted update to the canonical registry becomes discoverable on the next
    SELECT_INTERNAL_CAPABILITIES cycle without requiring a controller-code rewrite.
  runtime_boundary: >
    Discovery does not confer runtime authority. PracticalCore and specialized authority
    controls remain responsible for execution and mutation.

self_attack_modes:
  - hidden_dependency_reconstruction
  - alternate_representation
  - rival_architecture
  - noncommutation
  - state_quotient
  - critical_pair
  - termination
  - capability_ablation
  - historical_recovery
  - external_domain_holdout
  - runtime_boundary
  - self_reference_attack

candidate_generation:
  rule: >
    IC-022 may generate one or more successor architecture candidates. Candidate generation
    is independent of selection. A candidate is retained only if it demonstrates strict
    gain without protected-result regression.
  no_self_promotion: true
  promotion_authority: projects/pd/practical/PRACTICAL_CORE_CURRENT_ORDER.yaml

cycle:
  stages:
    - FREEZE_SELF
    - DISCOVER_SELF_DEFECTS
    - TYPE_DEFECTS
    - DISCOVER_CAPABILITY_REGISTRY
    - SELECT_INTERNAL_CAPABILITIES
    - GENERATE_SUCCESSORS
    - CHALLENGE_SUCCESSORS
    - EVALUATE_GAIN_AND_PRESERVATION
    - UPDATE_SELF_STATE
    - RESELECT
    - STOP_OR_CONTINUE

validation:
  inherited:
    - IC-021 validation pack
  new:
    - self-improvement holdout
    - candidate-vs-self ablation
    - self-reference attack
    - regression against IC-021
    - regression against promoted IC-018
    - cost/redundancy comparison
  status: pending

promotion:
  current_promoted_runtime: IC-2026-09-23-018
  current_candidate_predecessor: IC-2026-09-24-021
  status: unpromoted_experiment
  rule: >
    IC-022 cannot promote itself. A successful IC-022 run must produce a separate evidence
    packet demonstrating strict gain over IC-021 and preservation of IC-021 protected
    behavior, followed by ordinary external promotion validation.

open_frontier:
  - self-improvement convergence
  - global M minimality
  - efficient behavioral quotient computation
  - U termination and full critical-pair coverage
  - domain-lift surjectivity
  - unfamiliar-domain O-basis falsification
  - executable runtime realization


self_improvement_update_001:
  date: 2026-09-24
  source: IC-022 five-cycle self-run
  new_state_model:
    meta_state:
      referents:
        - controller_under_improvement
        - candidate_successor_under_evaluation
        - external_promotion_authority
    evaluation_context:
      tuple: [subject, comparator, authority, protected_basis]
      purpose: >
        Parameterize behavioral equivalence, routing sufficiency, transition preservation,
        and self-improvement evaluation by the referent and authority layer being evaluated.
    evidence_state:
      product: [semantic_evidence, runtime_evidence, authority_gate]
      rule: >
        Semantic improvement and runtime realization are independent coordinates. A candidate
        can be semantically validated while remaining runtime-unpromotable.
      promotion_status:
        VALIDATED_SEMANTIC_NOT_RUNTIME_PROMOTABLE:
          meaning: >
            Protected semantic behavior and mathematical claims are validated at the declared
            scope, while runtime execution/promotion evidence remains absent or insufficient.
  mathematical_effect: >
    The behavioral relation used for recursive self-improvement is lifted from
    ~beh_J to ~beh_(J,E) where E is the frozen evaluation context. Promotion is modeled
    as a typed evidence product followed by an external authority gate.
  preservation:
    - no self-promotion
    - authority separation
    - protected behavior regression
    - OPEN/INCOMPARABLE preservation
    - semantic/runtime distinction
  status: candidate_refinement_requires_validation


pd_system_sweep_001:
  source_scope:
    - projects/pd/protocol/PROTOCOL_CURRENT_STATE.md
    - projects/pd/protocol/OPERATION_LEDGER.md
    - projects/pd/protocol/MULTI_OBJECT_CONNECTOR_V2_IMPROVEMENT_PLAN_2026-09-23.md
    - projects/pd/protocol/RTC_V2_CANONICALIZATION_PROPAGATION_PLAN_2026-09-23.md
    - projects/pd/practical/LICENSED_TRANSITION_CONTRACT.yaml
    - projects/pd/practical/APPROVED_DELTA_CONTRACT.yaml
    - projects/pd/practical/EXECUTION_BINDING_CONTRACT.yaml
    - projects/pd/practical/AUTHORITY_RESOLUTION_CONTRACT.yaml
    - projects/pd/practical/PROMOTION_TRANSITION_CONTRACT.yaml
    - projects/pd/practical/FRICTION_CONTAINMENT_CONTRACT.yaml
    - projects/pd/g2u/REGRESSION_SUITE_v0.1.yaml
  newly_integrated_capabilities:
    licensed_transition:
      semantics: >
        A result-sensitive edge A --R--> B requires identity continuity, authority
        continuity, and consequence locality. A licensed edge does not automatically
        license a composite path. Missing identity/authority/proof remains OPEN or BLOCKED
        only for the dependent transition.
      control: projects/pd/practical/LICENSED_TRANSITION_CONTRACT.yaml
    approved_delta:
      semantics: >
        Analysis and recommendation are distinct from an exact approved production delta.
        Authorized change, target identity, affected scope, protected state, verification,
        and approval authority are frozen before transaction compilation.
      control: projects/pd/practical/APPROVED_DELTA_CONTRACT.yaml
    execution_binding:
      semantics: >
        External action is bound to exact authoritative identities and result-sensitive
        dependencies, then revalidated immediately before mutation. Identity drift blocks
        execution and requires a new binding/admission cycle.
      control: projects/pd/practical/EXECUTION_BINDING_CONTRACT.yaml
    authority_resolution:
      semantics: >
        Result-sensitive coordinates resolve to one controlling owner, locator, exact
        identity, and status without copying truth into the resolver. Multiple plausible
        owners or missing exact identity remain OPEN.
      control: projects/pd/practical/AUTHORITY_RESOLUTION_CONTRACT.yaml
    promotion_transition:
      semantics: >
        Attempt authority, technical verification, human acceptance, and canonical promotion
        are separate permissions. Promotion requires predecessor freshness, candidate
        identity continuity, acceptance evidence, verification, and promotion authority.
      control: projects/pd/practical/PROMOTION_TRANSITION_CONTRACT.yaml
    friction_containment:
      semantics: >
        Nonblocking workflow defects and architecture debt do not hijack the active task.
        A blocker requires a concrete result-sensitive dependency. Repair stops only the
        dependent action and targets the smallest shared cause.
      control: projects/pd/practical/FRICTION_CONTAINMENT_CONTRACT.yaml
    historical_successor_boundary:
      semantics: >
        Recovered historical audit semantics and designed runnable successor protocol are
        distinct objects. Improvements to the successor do not silently rewrite historical
        constitutive meaning. Transfer requires an explicit preservation/embedding relation.
      control: projects/pd/protocol/PROTOCOL_CURRENT_STATE.md
    continuation_basis:
      semantics: >
        Recursive behavioral minimality depends on an explicit admissible continuation and
        observation basis. Quotient/minimality claims remain relative while that basis is
        OPEN.
      control: projects/pd/protocol/PROTOCOL_CURRENT_STATE.md
    external_acquisition:
      semantics: >
        Deriving information internally is distinct from obtaining new information from an
        external information environment. Query, acquisition, and integration are separate
        typed transitions with provenance-preserving evidence packets.
      control: projects/pd/protocol/PROTOCOL_CURRENT_STATE.md
    vulnerability_recurrence_profile:
      semantics: >
        Recurrence control requires attacking load-bearing dependencies, locating the
        earliest affected dependency, retesting forward, detecting recurrence, escalating
        to the smallest common parent generator, and rerunning regression.
      control: projects/pd/protocol/PROTOCOL_CURRENT_STATE.md
  mathematical_integration:
    boundary_transition: >
      Add LicensedTransition as a typed admissibility predicate over graph edges. Relation
      alone never implies permission.
    execution_freshness: >
      Add freshness identity checks as an action-boundary invariant, distinct from semantic
      evaluation.
    promotion_evidence: >
      Retain E_sem x E_run x AuthorityGate as the promotion evidence product, now with
      explicit predecessor/candidate identity continuity.
    friction: >
      Treat blocker classification as part of C/U disposition handling, not a new primitive.
    historical_embedding: >
      Treat historical-to-successor preservation as an explicit bridge relation, not shared
      identity.
    continuation: >
      Parameterize behavioral equivalence by the declared continuation/observation basis.
  strict_gain_assessment:
    result: >
      These additions strengthen boundary control, authority/freshness semantics, and
      recursive audit behavior without introducing a ninth system role. They reduce hidden
      permission leakage and make runtime/promotion claims more precise.
  status: integrated_candidate_refinement


