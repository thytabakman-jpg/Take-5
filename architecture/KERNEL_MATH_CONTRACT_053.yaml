design_job:
  statement: >
    Define a successor system mathematics that preserves the protected behavior of 052,
    assigns substantive controller ownership explicitly, separates controller identity
    from kernel identity, and incorporates the later current protections without
    implementing or promoting the successor.
  success_condition: >
    Every protected behavior inherited from 052 has an explicit owner and preservation
    witness path; top-level substantive selection has exactly one current owner; guards
    constrain that owner without silently selecting in its place; OPEN, BLOCKED,
    CONFLICT, provenance, authority, execution truth, reentry, and currentness remain
    typed; unresolved placement questions remain explicit.
  non_goals:
    - runtime mutation
    - KERNEL.yaml mutation
    - promotion to production authority
    - deletion or rewriting of 052
    - mutation of frozen ICC128 Legacy snapshots
    - claim of universal external host interception

system_factorization:
  equation: "S = <K, W_beta, C, J, T, Gamma>"
  terms:
    K: common protected effect contract
    W_beta: orchestration wrapper under bound entry beta
    C: substantive controller role
    J: continuity and currentness supervisor
    T: typed capability and delegated-controller basis
    Gamma: authority, ingress, specification, execution, verification, commit, provenance, and currentness governance environment
  anti_loss_rule: "change(one factor) != silently_redefine(other factors)"
  controller_lineage_rule: "controller_lineage != kernel_lineage"

current_binding:
  controller_role:
    equation: "C_current = ICC128"
    status: CURRENT_BINDING_CANDIDATE
    evidence:
      - integration/CURRENT_ICC128_CONVERSATION_CONTROL.md
      - runtime/icc128_autonomous_controller.py
      - runtime/rho128_policy.py
  continuity_role:
    equation: "J_current = Jane"
    restriction: "Jane supervises continuity/currentness and does not own substantive action selection."
  improvement_core_role:
    equation: "ImprovementCore in T_C"
    interpretation: >
      ImprovementCore is an ICC128-selectable delegated controller for improvement
      subepisodes. It retains controller ownership inside the delegated improvement
      episode without owning the top-level ICC continuation frontier.
  binding_invariant: >
    Canonical repository-backed ICC execution may not substitute another substantive
    parent controller for C_current without an explicit successor contract, authority
    transition, preservation analysis, and currentness update.

controller_contract:
  role_equation: "C : <Z, MI, Q, W, T, Gamma> -> <SelectedWork, ContinuationDisposition>"
  current_loop: "G_Q -> G_W -> rho_128 -> E -> A -> U -> G_Q"
  current_owner: ICC128
  responsibilities:
    - generate or admit the live question frontier
    - generate or admit candidate work for live questions
    - select the nondominated continuation package under rho_128
    - delegate selected work through governed capability binding
    - consume admitted results
    - update controller state and memory
    - reselect after material result, search, representation, authority, capability, or failure deltas
    - determine substantive continuation versus typed terminal state
  prohibited_substitution:
    - host_selected_parent_controller
    - wrapper_selected_parent_controller
    - jane_selected_substantive_work
    - improvementcore_as_implicit_top_level_controller
    - arbitrary_ic_fn_on_canonical_icc_path
  guard_law: "Guards constrain C; guards do not choose in place of C."

kernel_common:
  equation: "K = K_ref AND K_auth AND K_trans AND K_admit AND K_status AND K_prov"
  interpretation: >
    K is the common protected effect contract shared by protected state species.
    Globally mandatory behavior may live outside K when another typed owner preserves
    it non-bypassably.
  laws:
    K_ref:
      law: >
        Protected referent, job, basis/currentness, and state-species identity remain
        stable for a governed effect.
      lineage:
        - I_entry
        - I_identity
    K_auth:
      law: >
        Effect authority is explicit, non-expanding, and cannot be manufactured by
        evidence, selection, semantic success, local success, or child execution.
      lineage:
        - I_authority
        - I_promotion
    K_trans:
      law: >
        A material effect is a typed transition with bound baseline, target/effect,
        expected or actual delta identity, and required execution/verification evidence.
      lineage:
        - I_transition
        - I_execution
    K_admit:
      law: >
        Authoritative or persistent update requires an admissible typed disposition.
        Proposed, selected, planned, or merely semantic output cannot directly commit.
      lineage:
        - I_admission
    K_status:
      law: >
        OPEN, BLOCKED, CONFLICT, supported INCOMPARABLE, and plural unresolved states
        remain non-success until a licensed transition resolves them.
      lineage:
        - I_open
        - I_closure
    K_prov:
      law: >
        Material committed deltas retain enough evidence, provenance, version, and
        dependency identity for lineage reconstruction, currentness, and reentry.
      lineage:
        - I_lineage
        - I_reentry

