  wrapper:
    owns:
      - ordering
      - frozen-math integrity
      - controller packet construction
      - episode closure/reentry envelope
    inherited:
      - I_freeze
  controller:
    owner: C
    owns:
      - substantive work selection
      - continuation
      - cross_capability replanning
      - result_sensitive reselection
      - controller terminality
      - Z_C_and_MI_update
    inherited:
      - I_reentry
      - controller_side_of_I_closure
  interface:
    owns:
      - selected capability binding
      - configured invocation plan construction
  runtime:
    owns:
      - dispatch
      - start
      - execution
      - capture
      - consumption evidence
    inherited:
      - execution_mechanics_of_I_execution
  verification:
    owns:
      - effect verification
      - episode closure verification
      - protected transition verification
    inherited:
      - verification_side_of_I_closure
  state:
    owns:
      - typed state-specific commit gates
      - commit receipt persistence
      - lineage storage
    inherited:
      - I_admission
      - I_lineage
  authority_currentness:
    owns:
      - currentness admission
      - promotion authority
      - no_self_promotion
      - formal authoritative emission
    inherited:
      - I_authority
      - I_promotion
  jane:
    owns:
      - continuity reconstruction
      - currentness supervision
      - supervisory sync after admitted relevant delta
    prohibited:
      - substantive action selection

state_commit_family:
  equation: "C_sigma(<z_sigma, delta, beta, receipts>) -> <z'_sigma, commit_receipt> OR OPEN/BLOCKED"
  state_roles:
    - SYSTEM_CONTROL
    - RESULT
    - LINEAGE
    - RESEARCH_CONTROL
    - SUPERVISORY
  common_requirement: "Every protected commit satisfies K."
  rule: >
    One abstract update role does not imply one physical store or one universal
    mutation function. State species may use distinct commit gates while sharing
    the common protected effect contract.

governed_execution:
  equation: "GovernedExec = ReturnReceipts o Commit_sigma? o Verify o Runtime o ConfiguredHF2 o Bind o EffectGate o SpecGate"
  interpretation: >
    GovernedExec is a service used by C. It does not choose the substantive work package.
    The optional Commit_sigma step is required exactly when selected work carries a licensed
    material target-state effect; evidence-only work returns evidence without target commit.
  stages:
    SpecGate:
      rule: "Transformation-relative specification adequacy is required for target transformation."
    EffectGate:
      rule: "Effect class must be EVIDENCE_ONLY or licensed TARGET_TRANSFORM."
    Bind:
      rule: "Bind the exact current selected capability identity and environment."
    ConfiguredHF2:
      profile: FULL_CONFIGURED_HF2_V1
    Runtime:
      rule: "Selected, bound, dispatched, started, executed, captured, and consumed remain distinct."
    Verify:
      rule: "Required semantic/effect/closure verification produces typed receipts."
    Commit_sigma:
      rule: "Only licensed material target effects cross the typed state-specific commit gate."
    ReturnReceipts:
      rule: "All success and non-success dispositions return to C for A_C and U_C."

wrapper:
  equation: "W_beta(C) = Sync_J o TRC_episode o C_episode o A_packet o G_round o Freeze o Phi o O_beta"
  interpretation: >
    W_beta is parameterized by a substantive controller role. The canonical ICC binding
    supplies ICC128. The wrapper owns ordering, frozen-math integrity, packet construction,
    episode closure, and supervisory synchronization. C owns substantive continuation selection.
    Target-state execution and commit occur through GovernedExec inside the controller episode,
    not as a second outer admission/update pass.
  round:
    - "o_n = O_beta(z_n)"
    - "m_n = Phi(o_n,beta)"
    - "mbar_n = Freeze(m_n)"
    - "g_round_n = G_round(mbar_n,beta)"
    - "a_n = A_packet(mbar_n,g_round_n,z_n,beta)"
    - "controller_result_n = C_episode(a_n,Z_C_n,MI_n,z_n;T,Gamma)"
    - "episode_closure_n = TRC_episode(controller_result_n,z_n,beta)"
    - "j_(n+1) = Sync_J(j_n,Delta_supervisory_n) when supervisory_relevant(Delta_supervisory_n)"
  controller_identity_gate:
    canonical_icc_requirement: "ControllerIdentity(C) = ICC128"
    failure: BLOCKED
    required_evidence:
      - current_controller_registration
      - controller_entry_receipt
      - controller_execution_receipt

packet_architecture:
  symbol: A_packet
  role: >
    Construct the typed packet and dependency context supplied to C from frozen observation
    and goal state.
  prohibition: >
    A_packet may formalize dependencies, constraints, authority, and candidate information.
    It may not make the top-level substantive continuation selection reserved to rho_128.
  unresolved_boundary: >
    Current architect_fn behavior must be audited for result-sensitive decisions before
    implementation of this successor.

goal_and_bootstrap:
  bootstrap:
    equation: "B_ICC = ASSERT_observer -> GOAL_configured[ValidMTPreflight]"
    role: >
      Establish admissible asserted state and governing goal evidence before substantive
      ICC controller work.
    required:
      - configured ASSERT observer execution
      - robust MT preflight for configured GOAL
      - configured GOAL observer execution
      - result capture and consumption
  round_goal:
    symbol: G_round
    status: ROLE_REQUIRES_EXPLICIT_RECONCILIATION
    rule: >
      The per-round operational-goal function must be typed separately from the bootstrap
      governing GOAL unless a successor proves they are the same object.
  open_question: >
    Determine whether bootstrap GOAL and G_round are distinct necessary roles, two views
    over one goal object, or an accidental duplicate introduced by wrapper evolution.

configured_tool_execution:
  profile: FULL_CONFIGURED_HF2_V1
  law: >
    A selected registered tool is not executed by naming, planning, semantic reasoning,
    or direct native invocation. It must cross configured binding, complete plan construction,
    configured HF2 recurrence, result capture, consumption, closure, and reentry.
  recurrence:
    ordinary_tool: HF002
    HF002: SELF
  missing_adapter: OPEN
  incomplete_identity: BLOCKED

specification_before_transformation:
  law: >
    Observe, discover, recover, formalize, compare, audit, verify, diagnose, and reconstruct
    may operate on OPEN objects. A material object transformation requires transformation-relative
    specification adequacy before execution.
  effect_classes:
    - EVIDENCE_ONLY
    - TARGET_TRANSFORM
  unknown_effect_class: OPEN
  transformation_without_specification: OPEN

protected_transition_integrity:
  coordinates:
    - canonical_identity
    - configured_dispatch
    - execution
    - result_consumption
    - state_update
    - reentry
    - user_visible_boundary
  law: >
    A protected behavior is operationally preserved only when every required coordinate has
    a witness. Manifest presence or execution alone is insufficient.

host_ingress:
  law: >
    ICC prefix expresses routing intent only. Repository-backed ICC identity requires
    exact-request host ingress admission, canonical repository/ref/commit evidence,
    bound entry, protected bootstrap, current ICC128 registration, and repository-backed
    controller execution.
  universal_external_host_interception: EXTERNAL_NOT_OWNED

currentness:
  law: >
    CURRENT is evidence-sensitive and basis-relative. A historical status label, file location,
    timestamp, or preserved runtime does not by itself establish current authority.
  current_controller_claim:
    object: ICC128
    requires:
      - registration
      - runtime realization
      - controller binding
      - execution receipt
      - preservation of protected controller behavior
  stale_basis_rule: >
    Any successor-changing material delta to controller, wrapper, kernel, state commit,
    tool invocation, authority, or host ingress reopens the affected dependency cone.

improvement_core:
  role: DELEGATED_IMPROVEMENT_SUBCONTROLLER
  top_level_icc_owner: false
  retained_behaviors:
    - observer_first_mode
    - recursive_parent_control_inside_delegated_episode
