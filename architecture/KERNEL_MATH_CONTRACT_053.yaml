    - configured_dispatch
    - execution
    - result_consumption
    - state_update
    - reentry
    - user_visible_boundary
  law: >
    A protected behavior is operationally preserved only when every required
    coordinate has a witness. Manifest presence or execution alone is insufficient.

host_ingress:
