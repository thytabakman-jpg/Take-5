state_role_classes:
  protected_commit_roles:
    commit_requirement: "Must cross Commit_sigma and satisfy K when materially updated."
    roles:
      SYSTEM_CONTROL: authoritative_control
      RESULT: authoritative_result
      LINEAGE: persistent_lineage
      RESEARCH_CONTROL: persistent_research_control
      SUPERVISORY: protected_supervisory_derived_state
  non_authoritative_or_episode_local:
    commit_requirement: >
      May update under its typed owner without masquerading as authoritative target state.
      Promotion into a protected commit role requires Commit_sigma.
    roles:
      - CONTROLLER_INTERNAL
      - EPISODE_WORKING
      - VALIDATION_DERIVED
      - PROJECT_LOCAL
      - OPEN_STATE_ROLE

state_commit_family:
  equation: "Commit_sigma(<z_sigma, delta, beta, receipts>) -> <z'_sigma, commit_receipt> OR OPEN/BLOCKED"
  current_coverage_status: PARTIAL_REQUIRES_RECONCILIATION
  successor_requirement: "Every authoritative or persistent protected state species has a typed commit path before 053 implementation closure."
  state_roles:
    - SYSTEM_CONTROL
    - RESULT
    - LINEAGE
    - RESEARCH_CONTROL
    - SUPERVISORY
  common_requirement: "Every protected commit satisfies K."
  rule: >
    One abstract update role does not imply one physical store or one universal
    mutation function. State species may use distinct commit gates while sharing
    the common protected effect contract.

governed_execution:
  branch_equations:
    evidence_only: "GovernedExec(w) = ReturnReceipts o Verify o Runtime o ConfiguredHF2 o Bind o EffectGate o SpecGate, when Effect(w)=EVIDENCE_ONLY"
    target_transform: "GovernedExec(w) = ReturnReceipts o Commit_sigma o Verify o Runtime o ConfiguredHF2 o Bind o EffectGate o SpecGate, when Effect(w)=TARGET_TRANSFORM and TransformLicensed(w)"
  interpretation: >
    GovernedExec is a service used by C. It does not choose the substantive work package.
    The optional Commit_sigma step is required exactly when selected work carries a licensed
    material target-state effect; evidence-only work returns evidence without target commit.
  stages:
    SpecGate:
      rule: "Transformation-relative specification adequacy is required for target transformation."
    EffectGate:
      rule: "Effect class must be EVIDENCE_ONLY or licensed TARGET_TRANSFORM."
    Bind:
      rule: "Bind the exact current selected capability identity and environment."
    ConfiguredHF2:
      profile: FULL_CONFIGURED_HF2_V1
    Runtime:
      rule: "Selected, bound, dispatched, started, executed, captured, and consumed remain distinct."
    Verify:
      rule: "Required semantic/effect/closure verification produces typed receipts."
    Commit_sigma:
      rule: "Only licensed material target effects cross the typed state-specific commit gate."
    ReturnReceipts:
      rule: "All success and non-success dispositions return to C for A_C and U_C."

episode_closure:
  symbol: TRC_episode
  role: >
    Verify basis-relative controller-episode closure after C_episode returns.
    TRC_episode may return CLOSED_RELATIVE, OPEN, BLOCKED, or CONFLICT and may signal
    upstream reentry. It does not select substantive work and does not replace C terminality.
  closure_requirement: >
    A user-visible terminal result requires both controller terminality and episode closure
    under the same frozen basis, with no live reentry trigger.
  no_local_to_global_rule: "Local child or capability closure does not imply controller-episode closure."

wrapper:
  equation: "W_beta(C) = Sync_J o TRC_episode o C_episode o Packetize o GoalProject o Freeze o Phi o O_beta"
  interpretation: >
    W_beta is parameterized by a substantive controller role. The canonical ICC binding
    supplies ICC128. The wrapper owns ordering, frozen-math integrity, packet construction,
    episode closure, and supervisory synchronization. C owns substantive continuation selection.
    Target-state execution and commit occur through GovernedExec inside the controller episode,
    not as a second outer admission/update pass.
  round:
    - "o_n = O_beta(Z_G_n)"
    - "m_n = Phi(o_n,beta)"
    - "mbar_n = Freeze(m_n)"
    - "g_n = GoalProject(G_ext,mbar_n,beta)"
    - "p_n = Packetize(mbar_n,g_n,Z_G_n,beta)"
    - "controller_result_n = C_episode(p_n,Z_C_n,MI_n,Z_G_n;T,Gamma)"
    - "episode_closure_n = TRC_episode(controller_result_n,Z_G_n,beta)"
    - "j_(n+1) = Sync_J(j_n,Delta_supervisory_n) when supervisory_relevant(Delta_supervisory_n)"
  controller_identity_gate:
    canonical_icc_requirement: "ControllerIdentity(C) = ICC128"
    failure: BLOCKED
    required_evidence:
      - current_controller_registration
      - controller_entry_receipt
      - controller_execution_receipt

packetization:
  symbol: Packetize
  role: >
    Construct the typed evidence/dependency packet supplied to C from frozen observation
    and the current governing-goal projection.
  prohibition: >
    Packetize may carry dependencies, constraints, authority, candidate evidence, and OPEN
    coordinates. It may not select the top-level substantive continuation reserved to rho_128.
  current_runtime_mapping_candidate: runtime/math_first_wrapper.py::architect_fn
  unresolved_boundary: >
    Current architect_fn behavior must be audited for result-sensitive decisions before
    implementation. Any such selection behavior must move to C or be explicitly typed as
    a non-selection transformation.

goal_and_bootstrap:
  bootstrap:
    equation: "B_ICC = ASSERT_observer -> GOAL_configured[ValidMTPreflight]"
    role: >
      Recover and admit governing goal G_ext before substantive ICC controller work.
    required:
      - configured ASSERT observer execution
      - robust MT preflight for configured GOAL
      - configured GOAL observer execution
      - result capture and consumption
  governing_goal:
    symbol: G_ext
    owner: GOAL_configured
    law: "G_ext may change only through governed upstream GOAL reentry."
  round_projection:
    symbol: GoalProject
    equation: "g_n = GoalProject(G_ext,mbar_n,beta)"
    role: >
      Project the already-admitted governing goal into the current frozen observation basis.
      GoalProject is not a second GOAL invocation and cannot create, rank, or replace governing goals.
    conflict_rule: >
      A material conflict between G_ext and the current frozen basis returns upstream for GOAL
      reentry rather than silently changing G_ext inside the wrapper.

configured_tool_execution:
  profile: FULL_CONFIGURED_HF2_V1
  current_default_effect: EVIDENCE_ONLY
  effect_rule: >
    The current configured repository-tool contract is observer/evidence-oriented.
    A future configured TARGET_TRANSFORM path requires explicit effect authority and may
    not be inferred from current tool registration alone.
  law: >
    A selected registered tool is not executed by naming, planning, semantic reasoning,
    or direct native invocation. It must cross configured binding, complete plan construction,
    configured HF2 recurrence, result capture, consumption, closure, and reentry.
  recurrence:
    ordinary_tool: HF002
    HF002: SELF
  missing_adapter: OPEN
  incomplete_identity: BLOCKED

specification_before_transformation:
  law: >
    Observe, discover, recover, formalize, compare, audit, verify, diagnose, and reconstruct
    may operate on OPEN objects. A material object transformation requires transformation-relative
    specification adequacy before execution.
  effect_classes:
    - EVIDENCE_ONLY
    - TARGET_TRANSFORM
  unknown_effect_class: OPEN
  transformation_without_specification: OPEN

protected_transition_integrity:
  coordinates:
    - canonical_identity
    - configured_dispatch
    - execution
    - result_consumption
    - state_update
    - reentry
    - user_visible_boundary
  law: >
    A protected behavior is operationally preserved only when every required coordinate has
    a witness. Manifest presence or execution alone is insufficient.

host_ingress:
  law: >
    ICC prefix expresses routing intent only. Repository-backed ICC identity requires
    exact-request host ingress admission, canonical repository/ref/commit evidence,
    bound entry, protected bootstrap, current ICC128 registration, and repository-backed
    controller execution.
  universal_external_host_interception: EXTERNAL_NOT_OWNED

currentness:
  law: >
    CURRENT is evidence-sensitive and basis-relative. A historical status label, file location,
    timestamp, or preserved runtime does not by itself establish current authority.
  repository_current_controller_claim:
    object: ICC128
    requires:
      - current registration
      - current runtime realization
      - currentness evidence
      - preservation of protected controller behavior
  per_turn_controller_execution_claim:
    object: ICC128
    requires:
      - repository_current_controller_claim
      - controller binding for the exact episode
      - controller execution receipt
      - host ingress receipt when the claim is made through an external hosted ICC surface
  distinction_rule: >
    Repository currentness of ICC128 does not prove that ICC128 executed a particular turn.
    A per-turn execution receipt does not by itself establish repository currentness.
  stale_basis_rule: >
    Any successor-changing material delta to controller, wrapper, kernel, state commit,
    tool invocation, authority, or host ingress reopens the affected dependency cone.

improvement_core:
  role: DELEGATED_IMPROVEMENT_SUBCONTROLLER
  top_level_icc_owner: false
  protected_controller_ownership_scope: DELEGATED_IMPROVEMENT_EPISODE_ONLY
  retained_behaviors:
    - observer_first_mode
    - recursive_parent_control_inside_delegated_episode
    - configured_tool_execution
    - HF002_local_recurrence
    - durable_negative_learning
    - durable_knowledge_capture
    - strict_progress
    - external_acquisition
    - plural_frontier_preservation
    - result_sensitive_replanning_inside_delegated_episode
  boundary_rule: >
    ImprovementCore may select child work inside an ICC128-selected improvement subepisode.
    Completion of that subepisode returns governed receipts/results to ICC128, which owns the
    next top-level substantive continuation decision.

jane:
  role: CONTINUITY_CURRENTNESS_SUPERVISOR
  top_level_substantive_selection_owner: false
  handoff: "READY Jane continuity -> explicit ICC128 Z_C and MI"
  missing_continuity: OPEN

