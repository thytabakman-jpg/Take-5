design_job:
  statement: >
    Define a successor system mathematics that preserves the protected behavior of 052,
    assigns substantive controller ownership explicitly, separates controller identity
    from kernel identity, distinguishes controller state from governed target state,
    and incorporates later current protections without implementing or promoting the successor.
  success_condition: >
    Every protected behavior inherited from 052 has an explicit owner and preservation
    path; top-level substantive selection has exactly one current owner; guards constrain
    that owner without selecting in its place; controller-state update is distinguished
    from authoritative target-state commit; OPEN, BLOCKED, CONFLICT, provenance, authority,
    execution truth, reentry, and currentness remain typed; unresolved placement questions
    remain explicit.
  non_goals:
    - runtime mutation
    - KERNEL.yaml mutation
    - promotion to production authority
    - deletion or rewriting of 052
    - mutation of frozen ICC128 Legacy snapshots
    - claim of universal external host interception

system_factorization:
  equation: "S = <K, W_beta, C, J, T, Gamma>"
  terms:
    K: common protected effect contract
    W_beta: orchestration wrapper under bound entry beta
    C: substantive controller role
    J: continuity and currentness supervisor
    T: typed capability basis
    Gamma: typed governance environment
  gamma_coordinates:
    - authority
    - host_ingress
    - specification
    - configured_binding
    - execution_truth
    - verification
    - state_commit
    - provenance
    - currentness
    - durability_backend
  anti_loss_rule: "change(one factor) != silently_redefine(other factors)"
  controller_lineage_rule: "controller_lineage != kernel_lineage"
  gamma_rule: >
    Gamma is a typed product of governance services, not an untyped residual bucket.
    Each coordinate has an owner and may not perform substantive controller selection.

symbol_table:
  K: common protected effect contract
  W_beta: bound orchestration wrapper
  C: substantive controller role
  J: continuity/currentness supervisor
  T: typed capability basis
  T_controller: delegated-controller subset of T
  Gamma: typed governance environment
  D_exec: pluggable durable execution and replay backend role inside Gamma
  ConfiguredInvoke_D: configured HF2 invocation whose adapter executes through D_exec
  Z_C: controller state
  MI: controller memory
  z_sigma: governed target state of species sigma
  Sigma_state: index set of governed target-state species
  Z_G: governed target-state product across Sigma_state
  Commit_sigma: typed state-specific authoritative commit gate
  G_ext: admitted governing goal
  GoalProject: projection of G_ext into the current frozen observation basis
  Packetize: evidence/dependency packet construction with no substantive selection authority
  A_C: controller evidence reconciliation
  U_C: controller-state and controller-memory update
  TRC_episode: controller-episode closure verifier
  O_beta: nonmutating observation under bound entry beta
  Phi: observation formalization
  symbol_uniqueness_rule: "One load-bearing symbol has one role within 053; overloaded historical symbols are renamed before reuse."

state_domains:
  governed_state_product:
    equation: "Z_G = product_{sigma in Sigma_state} z_sigma"
    meaning: read-visible governed target-state family for the current controller episode
    mutation_rule: "Z_G changes only through one or more admitted Commit_sigma transitions."
  controller_state:
    symbol: Z_C
    meaning: ICC128 governing problem and continuation state
    mutation_owner: C
    authority: CONTROLLER_INTERNAL
  controller_memory:
    symbol: MI
    meaning: per-object controller memory, rejection/failure memory, mathematical/status memory
    mutation_owner: C
    authority: CONTROLLER_INTERNAL
  governed_target_state:
    symbol: z_sigma
    meaning: authoritative or persistent state of state species sigma
    mutation_owner: Commit_sigma
    authority: STATE_SPECIFIC_COMMIT
  supervisory_state:
    symbol: j
    meaning: Jane continuity/currentness supervisory state
    mutation_owner: J
    authority: SUPERVISORY
  separation_law: >
    U_C may update Z_C and MI after admitted controller evidence. U_C does not itself
    commit governed target state z_sigma. Material target effects require Commit_sigma.

