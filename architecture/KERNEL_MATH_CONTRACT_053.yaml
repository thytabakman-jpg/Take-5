    - result_sensitive_replanning_inside_delegated_episode
  boundary_rule: >
    ImprovementCore may select child work inside an ICC128-selected improvement subepisode.
    Completion of that subepisode returns governed receipts/results to ICC128, which owns the
    next top-level substantive continuation decision.

jane:
