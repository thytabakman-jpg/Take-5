protected_transition_integrity:
  coordinates:
    - canonical_identity
    - configured_dispatch
    - execution
    - result_consumption
    - state_update
    - reentry
    - user_visible_boundary
  law: >
    A protected behavior is operationally preserved only when every required coordinate has
    a witness. Manifest presence or execution alone is insufficient.

host_ingress:
  law: >
    ICC prefix expresses routing intent only. Repository-backed ICC identity requires
    exact-request host ingress admission, canonical repository/ref/commit evidence,
    bound entry, protected bootstrap, current ICC128 registration, and repository-backed
    controller execution.
  universal_external_host_interception: EXTERNAL_NOT_OWNED

currentness:
  law: >
    CURRENT is evidence-sensitive and basis-relative. A historical status label, file location,
    timestamp, or preserved runtime does not by itself establish current authority.
  repository_current_controller_claim:
    object: ICC128
    requires:
      - current registration
      - current runtime realization
      - currentness evidence
      - preservation of protected controller behavior
  per_turn_controller_execution_claim:
    object: ICC128
    requires:
      - repository_current_controller_claim
      - controller binding for the exact episode
      - controller execution receipt
      - host ingress receipt when the claim is made through an external hosted ICC surface
  distinction_rule: >
    Repository currentness of ICC128 does not prove that ICC128 executed a particular turn.
    A per-turn execution receipt does not by itself establish repository currentness.
  stale_basis_rule: >
    Any successor-changing material delta to controller, wrapper, kernel, state commit,
    tool invocation, authority, or host ingress reopens the affected dependency cone.

