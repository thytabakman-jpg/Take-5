state_commit_family:
  equation: "C_sigma(<z_sigma, delta, beta, receipts>) -> <z'_sigma, commit_receipt> OR OPEN/BLOCKED"
  state_roles:
    - SYSTEM_CONTROL
    - RESULT
    - LINEAGE
    - RESEARCH_CONTROL
    - SUPERVISORY
  common_requirement: "Every protected commit satisfies K."
  rule: >
    One abstract update role does not imply one physical store or one universal
    mutation function. State species may use distinct commit gates while sharing
    the common protected effect contract.

wrapper:
  equation: "W_beta(C) = Sync_J o Commit_sigma o Verify o Admit o C o A o G_round o Freeze o Phi o O_beta"
  interpretation: >
    W_beta is parameterized by a substantive controller role. The canonical ICC
    binding supplies ICC128. The wrapper owns ordering and guards; C owns substantive
    continuation selection.
  round:
    - "o_n = O_beta(z_n)"
    - "m_n = Phi(o_n,beta)"
    - "mbar_n = Freeze(m_n)"
    - "g_round_n = G_round(mbar_n,beta)"
    - "a_n = A(mbar_n,g_round_n,z_n,beta)"
    - "y_n = C(a_n,z_n,MI_n;T,Gamma)"
    - "v_n = Verify(z_n,y_n,beta,Gamma)"
    - "c_n = Admit(v_n,beta,Gamma)"
    - "z_(n+1) = Commit_sigma(z_n,c_n,beta,receipts_n)"
    - "j_(n+1) = Sync_J(j_n,Delta z_n) when supervisory_relevant(Delta z_n)"
    - "C reenters when admitted material continuation remains"
  controller_identity_gate:
    canonical_icc_requirement: "ControllerIdentity(C) = ICC128"
    failure: BLOCKED
    required_evidence:
      - current_controller_registration
      - controller_entry_receipt
      - controller_execution_receipt

goal_and_bootstrap:
  bootstrap:
    equation: "B_ICC = ASSERT_observer -> GOAL_configured[ValidMTPreflight]"
    role: >
      Establish admissible asserted state and governing goal evidence before
      substantive ICC controller work.
    required:
      - configured ASSERT observer execution
      - robust MT preflight for configured GOAL
      - configured GOAL observer execution
      - result capture and consumption
  round_goal:
    symbol: G_round
    status: ROLE_REQUIRES_EXPLICIT_RECONCILIATION
    rule: >
      The per-round operational-goal function must be typed separately from the
      bootstrap governing GOAL unless a successor proves they are the same object.
  open_question: >
    Determine whether bootstrap GOAL and G_round are distinct necessary roles,
    two views over one goal object, or an accidental duplicate introduced by
    wrapper evolution.

