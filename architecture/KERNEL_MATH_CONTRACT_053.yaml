design_boundary_resolution:
  packetize_vs_selection:
    status: DESIGN_RESOLVED_IMPLEMENTATION_OPEN
    current_runtime_finding: >
      runtime/math_first_wrapper.py accepts caller-supplied architect_fn and validates
      target, job, and authority drift, but it does not enforce that the returned packet
      is free of substantive selection. Existing wrapper tests use empty selector fields
      and therefore do not prove a non-selection boundary.
    successor_rule: >
      Packetize is a typed projection only. It may carry selector evidence or candidate
      metadata, but it may not choose selected work, selected tools, or continuation.
      Any result-sensitive substantive choice belongs to rho_128 inside C.
    implementation_change_required:
      - replace or constrain architect_fn as Packetize
      - validate a no-substantive-selection output schema
      - add a holdout where a Packetize callback attempts to select work and is blocked
  icc128_wrapper_adapter:
    status: DESIGN_RESOLVED_IMPLEMENTATION_OPEN
    reuse_source: runtime/improvement_core_legacy_candidate.py::run_legacy_candidate
    reusable_pattern:
      - construct ICC128Controller from injected semantic generation and governed execution adapters
      - use rho_128 for state-relative selection
      - route formal tools through bind_selected_tools and execute_bound_tools
      - preserve typed OPEN, BLOCKED, and CONFLICT
    successor_difference: >
      The canonical adapter binds runtime/icc128_autonomous_controller.py directly rather
      than activating the frozen Legacy snapshot. Canonical run_icc must bind this adapter
      internally and must not accept arbitrary parent-controller ic_fn injection.
  wrapper_to_icc128_semantic_boundary:
    status: DESIGN_RESOLVED_IMPLEMENTATION_OPEN
    law: >
      O_beta, Phi, Freeze, GoalProject, and Packetize may recover, formalize, freeze,
      project, and package evidence. They may not generate the live question frontier
      or work frontier.
    first_question_generation_owner: G_Q
    first_work_generation_owner: G_W
    consequences:
      - Packetize may carry unresolved coordinates and candidate evidence but not question_frontier
      - Packetize may carry capability metadata but not work_frontier
      - G_Q consumes the frozen packet plus Z_C and MI to generate live questions
      - G_W consumes Q_t plus controller state and capability basis to generate candidate work
      - rho_128 alone owns top-level substantive selection
    implementation_holdout: >
      Inject wrapper/Packetize outputs containing question_frontier, work_frontier,
      selected_work, or selected_tools and require canonical ICC binding to reject them.

  improvementcore_return_to_icc128:
    status: DESIGN_RESOLVED_IMPLEMENTATION_OPEN
    reuse_source:
      - runtime/improvement_core_tool_bridge.py
      - runtime/improvement_core_legacy_candidate.py
    reusable_receipt_shape: >
      ConfiguredToolExecution already carries tool identity, status, execution truth,
      result, evidence, material delta, binding, and recurrence metadata.
    anti_copy_rule: >
      Do not copy the Legacy candidate's unrestricted state_after_execution patch into
      ICC128 parent state. A delegated controller returns a typed child result/delta.
      ICC128 A_C admits/reconciles that result, and ICC128 U_C alone updates Z_C and MI.
    required_projection:
      equation: "ProjectChildResult(ImprovementCoreResult, receipts) -> ICC128Delta"
      must_preserve:
        - child status
        - execution truth
        - configured binding identity
        - HF2 recurrence disposition
        - material result/search/discovery deltas
        - evidence and provenance
        - OPEN, BLOCKED, and CONFLICT
        - changed dependency or representation coordinates
      must_not_preserve_as_parent_authority:
        - arbitrary child parent-state patches
        - child-owned terminality as ICC128 terminality
        - child selector decisions as top-level continuation decisions

controller_contract:
  role_equation: "C : <Z_C, MI, Z_G, T, Gamma> -> <Z_C', MI', ControllerDisposition, Receipts>"
  current_owner: ICC128
  current_cycle:
    - "Q_t = G_Q(Z_C_t, MI_t, Evidence_t)"
    - "W_t = G_W(Q_t, Z_C_t, MI_t, T)"
    - "S_t = rho_128(Q_t, W_t, Z_C_t, MI_t, Gamma)"
    - "R_t = GovernedExec(S_t, Z_G_t, Gamma)"
    - "D_t = A_C(R_t, Z_C_t, MI_t)"
    - "<Z_C_(t+1), MI_(t+1)> = U_C(Z_C_t, MI_t, D_t)"
    - "Reenter G_Q when admitted substantive continuation remains"
  operator_types:
    G_Q: QUESTION_GENERATION
    G_W: WORK_GENERATION
    rho_128: SUBSTANTIVE_SELECTION
    GovernedExec: GOVERNED_EXECUTION_SERVICE
    A_C: CONTROLLER_EVIDENCE_RECONCILIATION
    U_C: CONTROLLER_STATE_MEMORY_UPDATE
  responsibilities:
    - generate or admit the live question frontier
    - generate or admit candidate work for live questions
    - select the nondominated continuation package under rho_128
    - request governed execution of selected work
    - consume execution, verification, commit, OPEN, BLOCKED, and CONFLICT receipts
    - reconcile returned evidence into controller state
    - update Z_C and MI
    - reselect after material result, search, representation, authority, capability, or failure deltas
    - determine substantive continuation versus typed terminal state
  target_mutation_prohibition: >
    C, G_Q, G_W, rho_128, A_C, and U_C do not directly mutate Z_G or any z_sigma.
    Target mutation occurs only through the state-specific governed execution/commit path.
  prohibited_substitution:
    - host_selected_parent_controller
    - wrapper_selected_parent_controller
    - jane_selected_substantive_work
    - improvementcore_as_implicit_top_level_controller
    - arbitrary_ic_fn_on_canonical_icc_path
  guard_law: "Guards constrain C; guards do not choose in place of C."

kernel_common:
  equation: "K = K_ref AND K_auth AND K_trans AND K_admit AND K_status AND K_prov"
  interpretation: >
    K is the common protected effect contract shared by protected state species.
    Globally mandatory behavior may live outside K when another typed owner preserves
    it non-bypassably.
  laws:
    K_ref:
      law: >
        Protected referent, job, basis/currentness, and state-species identity remain
        stable for a governed effect.
      lineage:
        - I_entry
        - I_identity
    K_auth:
      law: >
        Effect authority is explicit, non-expanding, and cannot be manufactured by
        evidence, selection, semantic success, local success, or child execution.
      lineage:
        - I_authority
        - I_promotion
    K_trans:
      law: >
        A material effect is a typed transition with bound baseline, target/effect,
        expected or actual delta identity, and applicable execution and verification
        evidence required by its effect class.
      lineage:
        - I_transition
        - I_execution
    K_admit:
      law: >
        Authoritative or persistent update requires an admissible typed disposition.
        Proposed, selected, planned, or merely semantic output cannot directly commit.
      lineage:
        - I_admission
    K_status:
      law: >
        OPEN, BLOCKED, CONFLICT, supported INCOMPARABLE, and plural unresolved states
        remain non-success until a licensed transition resolves them.
      lineage:
        - I_open
        - I_closure
    K_prov:
      law: >
        Material committed deltas retain enough evidence, provenance, version, and
        dependency identity for lineage reconstruction, currentness, and reentry.
      lineage:
        - I_lineage
        - I_reentry

typed_global_owners:
  entry_interface:
    owns:
      - bound entry beta
      - target/job identity binding
      - host ingress receipt validation
    inherited:
      - I_entry
      - part_of_I_identity
  architecture_constitution:
    owns:
      - distinctions_do_not_imply_surfaces
      - strict_gain_for_new_operating_surfaces
      - protected_behavior_preservation_under_successor_change
    inherited:
      - I_surface
  observer:
    owns:
      - nonmutating observation
      - observer_first evidence acquisition
    inherited:
      - I_observe
  wrapper:
    owns:
      - ordering
      - frozen-math integrity
      - controller packet construction
      - episode closure/reentry envelope
    inherited:
      - I_freeze
  controller:
    owner: C
    owns:
      - substantive work selection
      - continuation
      - cross_capability replanning
      - result_sensitive reselection
      - controller terminality
      - Z_C_and_MI_update
    inherited:
      - I_reentry
      - controller_side_of_I_closure
  interface:
    owns:
      - selected capability binding
      - configured invocation plan construction
  runtime:
    owns:
      - dispatch
      - start
      - execution
      - capture
      - consumption evidence
    inherited:
      - execution_mechanics_of_I_execution
  durability_infrastructure:
    owner: D_exec
    owns:
      - durable scheduling
      - replay and checkpoint support
      - child-workflow or equivalent lifecycle
      - runtime adapter hosting
      - durable execution history
    prohibited:
      - substantive work selection
      - authority expansion
      - direct protected target-state commit outside Commit_sigma
  verification:
    owns:
      - effect verification
      - episode closure verification
      - protected transition verification
    inherited:
