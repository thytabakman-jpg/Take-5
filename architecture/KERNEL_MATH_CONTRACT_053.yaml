    ICC prefix expresses routing intent only. Repository-backed ICC identity requires
    exact-request host ingress admission, canonical repository/ref/commit evidence,
    bound entry, protected bootstrap, current ICC128 registration, and repository-backed
    controller execution.
  universal_external_host_interception: EXTERNAL_NOT_OWNED

currentness:
  law: >
    CURRENT is evidence-sensitive and basis-relative. A historical status label,
    file location, timestamp, or preserved runtime does not by itself establish
    current authority.
  current_controller_claim:
    object: ICC128
    requires:
      - registration
      - runtime realization
      - controller binding
      - execution receipt
      - preservation of protected controller behavior
  stale_basis_rule: >
    Any successor-changing material delta to controller, wrapper, kernel, state commit,
    tool invocation, authority, or host ingress reopens the affected dependency cone.

