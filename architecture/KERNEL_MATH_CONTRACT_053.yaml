specification_before_transformation:
  law: >
    Observe, discover, recover, formalize, compare, audit, verify, diagnose, and
    reconstruct may operate on OPEN objects. A material object transformation
    requires transformation-relative specification adequacy before execution.
  effect_classes:
    - EVIDENCE_ONLY
    - TARGET_TRANSFORM
  unknown_effect_class: OPEN
  transformation_without_specification: OPEN

