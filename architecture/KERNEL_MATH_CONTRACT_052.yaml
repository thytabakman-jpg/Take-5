alignment_candidate:
  status: CANDIDATE_NOT_IMPLEMENTED
  purpose: "Reduce ICC/user entry-state misalignment without replacing current wrapper, IC, Jane, or Take Two flexibility laws."
  entry_state:
    equation: "theta=<G_ext,T,M,C,S,F>"
    coordinates:
      G_ext: external intended goal
      T: target/referent
      M: controller/mode/autonomy
      C: protected constraints and process invariants
      S: relevant state/baseline
      F: finish/completion predicate
  candidate_set:
    equation: "C(u,z,j,beta)={theta | Consistent(theta,u,z,j,beta)}"
  result_sensitive_ambiguity:
    equation: "Amb_H(C)={d | exists theta1,theta2 in C: theta1[d] != theta2[d] AND ResultSensitive(d)}"
  gate:
    equation: "Proceed without clarification iff Amb_H(C)=empty; otherwise resolve exactly one highest-impact live coordinate before substantive execution"
  correction_learning:
    equation: "correction=(context,theta_hat,theta_user); Delta_theta={d | theta_hat[d] != theta_user[d]}; update alignment model from Delta_theta, not from surface wording alone"
  proposed_placement:
    equation: "beta=B_J(u); theta_hat=Lambda(u,z,j,beta); then O_(beta,theta_hat) -> Phi -> Freeze -> G -> A -> IC -> C_TR -> U -> Sync_J"
  protected_rule: "Lambda may constrain interpretation but may not weaken K."

change_protocol:
  rule_1: "Never change a symbol without listing every invariant, behavior witness, implementation path, and test that depends on that symbol."
  rule_2: "A proposed equation K' or W' is admissible only when protected behavior is reconstructible from the new terms."
  rule_3: "Deleted terms remain recoverable by versioned equation and lineage mapping."
  rule_4: "Math freeze precedes implementation change."
  rule_5: "This artifact is review-only and does not authorize runtime mutation."

