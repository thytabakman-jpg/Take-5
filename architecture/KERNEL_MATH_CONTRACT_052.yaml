    I_entry:
      law: "SubstantiveAction(u,z) => Bound(beta)"
      implementation:
        - runtime/entry_contract.py
    I_identity:
      law: "Target'(beta)=Target(beta) AND Job'(beta)=Job(beta) during an episode"
      implementation:
        - runtime/entry_contract.py
        - runtime/math_first_wrapper.py
    I_surface:
      lineage: TAKE_TWO
      law_1: "Distinct(a,b) does_not_imply SeparateOperatingSurface(a,b)"
      law_2: "AdmitNewSurface(x) => NOT ExistsBehaviorallySufficientViewOrComposition(x) AND StrictGain(x)"
      implementation:
        - KERNEL.yaml
      historical_evidence:
        - thytabakman-jpg/Take-2/KERNEL.yaml
        - thytabakman-jpg/Take-2/ARCHITECTURE.md
    I_transition:
      lineage: TAKE_TWO
      law: "ConsequentialChange(z,z') => Exists(tau): Authorized(tau) AND Applied(tau) AND Verified(tau)"
      historical_evidence:
        - thytabakman-jpg/Take-2/KERNEL.yaml
        - thytabakman-jpg/Take-2/ARCHITECTURE.md
    I_authority:
      law: "Authority(out) subseteq Authority(beta); Evidence does not self-authorize; child authority cannot exceed grant"
      implementation:
        - runtime/math_first_wrapper.py
        - runtime/delegation.py
        - KERNEL.yaml
    I_observe:
      law: "Observe_beta(z) is nonmutating with respect to live z"
      implementation:
        - runtime/math_first_wrapper.py
        - runtime/entry_contract.py
    I_freeze:
      law: "mbar=Freeze(m); Fingerprint(m_after_IC)=Fingerprint(mbar) or episode=BLOCKED"
      implementation:
        - runtime/math_first_wrapper.py
    I_execution:
      law: "Executed != Specified; CompleteExecution => Selected AND Bound AND Dispatched AND Started AND Executed AND Captured AND Consumed"
      implementation:
        - runtime/controller_episode.py
        - runtime/activation_bridge.py
    I_admission:
      law: "PersistentUpdate(z,c) only occurs after ToolRunClosure returns an admissible typed closure state"
      implementation:
        - runtime/math_first_wrapper.py
        - runtime/tool_run_closure.py
    I_open:
      law: "OPEN, BLOCKED, and supported INCOMPARABLE states are preserved and cannot be coerced into success"
      implementation:
        - runtime/tool_run_closure.py
        - runtime/recursive_episode.py
        - KERNEL.yaml
    I_closure:
      law: "RelativeClose => chi=CLOSED AND Result(z_next) equiv_Q Result(z_now) AND NoLiveReentryTrigger"
      implementation:
        - runtime/math_first_wrapper.py
        - runtime/tool_run_closure.py
