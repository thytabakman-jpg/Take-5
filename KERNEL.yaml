schema_version: 0.1
system: adaptive_inquiry_kernel
status: transferable_candidate

principles:
  - distinctions_do_not_imply_surfaces
  - views_and_compositions_before_new_subsystems
  - evidence_does_not_self_authorize
  - consequential_change_uses_typed_transition
  - observation_precedes_causal_claim
  - preserve_OPEN_and_incomparability
  - selected_is_not_executed
  - executed_is_not_admitted
  - admitted_is_not_consumed
  - controller_owns_internal_continuation
  - negative_evidence_is_basis_relative_memory
  - migrate_capabilities_not_files
  - capability_presence_is_not_capability_preservation
  - no_self_promotion

primitives:
  object: [id, kind, status, authority]
  relation: [id, type, source, target, authority, evidence]
  event: [id, type, occurred_at, subject, evidence]
  transition: [id, type, baseline, target, authority, evidence, protected, validators, status]
  observation: [id, type, subject, source, observed_at, result]

terminal_dispositions: [COMPLETE, OPEN, BLOCKED, CONFLICT]
transition_statuses: [PROPOSED, AUTHORIZED, APPLIED, VERIFIED, BLOCKED, SUPERSEDED]

operating_law:
  - OBSERVE
  - FREEZE_TYPE
  - DISCOVER_CHALLENGE
  - DIAGNOSE_WHEN_LIVE
  - DECIDE_UNDER_AUTHORITY
  - TRANSITION
  - VERIFY
  - OBSERVE
  - REENTER_ON_MATERIAL_DELTA

capability_preservation:
  required_coordinates:
    - identity
    - semantics
    - reachability
    - selection
    - execution
    - effect
    - consumer
    - recovery
